<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You can do this</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #f4effc;
  --ink: #45365f;
  --ink-soft: #7a6c95;
  --card: #ffffff;
  --line: #e3d9f3;
  --lilac: #d8c8f5;
  --mint: #c6efdc;
  --peach: #ffd8c4;
  --butter: #fff0b3;
  --sky: #c9e4fa;
  --rose: #f8cfe0;
  --on-pastel: #45365f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2a2238;
    --ink: #f1eafc;
    --ink-soft: #b9acd1;
    --card: #372d49;
    --line: #4a3f61;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2a2238;
  --ink: #f1eafc;
  --ink-soft: #b9acd1;
  --card: #372d49;
  --line: #4a3f61;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  font-size: 18px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }

.app { max-width: 560px; margin: 0 auto; padding: 24px 20px 40px; min-height: 100vh; display: flex; flex-direction: column; }
[hidden] { display: none !important; }
h1, h2, p { margin: 0; }
h1 { font-size: 2.1rem; font-weight: 600; line-height: 1.1; }
h2 { font-size: 1.5rem; font-weight: 600; }
.sub { color: var(--ink-soft); margin-top: 6px; }

button { font: inherit; color: inherit; cursor: pointer; border: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* Home */
.brand { display: inline-block; background: var(--lilac); color: var(--on-pastel); font-weight: 600; font-size: 1rem; padding: 6px 16px; border-radius: 999px; margin-bottom: 14px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 28px; }
.icon-btn { background: var(--card); border: 2px solid var(--line); width: 48px; height: 48px; border-radius: 50%; font-size: 1.3rem; flex: none; display: grid; place-items: center; }

.times { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.time {
  border-radius: 28px; padding: 22px 12px 18px; color: var(--on-pastel);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: transform .15s ease;
}
.time:active { transform: scale(.96); }
.time b { font-size: 3rem; font-weight: 600; line-height: 1; }
.time span { font-size: 1rem; margin-top: 4px; opacity: .8; }
.time:nth-child(1) { background: var(--mint); border-radius: 36px 28px 28px 28px; }
.time:nth-child(2) { background: var(--sky); border-radius: 28px 36px 28px 28px; }
.time:nth-child(3) { background: var(--rose); border-radius: 28px 28px 28px 36px; }
.time:nth-child(4) { background: var(--butter); border-radius: 28px 28px 36px 28px; }
.time:nth-child(5) { background: var(--peach); grid-column: 1 / -1; flex-direction: row; gap: 14px; }
.time:nth-child(5) span { margin: 0; align-self: flex-end; padding-bottom: 6px; }
.note { margin-top: 26px; color: var(--ink-soft); font-size: .95rem; text-align: center; }

/* Timer */
#screen-timer, #screen-reward, #screen-settings { flex: 1; }
.center { display: flex; flex-direction: column; align-items: center; text-align: center; }
.ring-wrap { position: relative; width: min(78vw, 340px); aspect-ratio: 1; margin: 22px 0 26px; }
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { stroke: var(--line); }
.ring-fg { stroke: var(--lilac); transition: stroke-dashoffset .4s linear; }
.ring-text { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-text b { font-size: 3.6rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.ring-text span { color: var(--ink-soft); font-size: 1rem; margin-top: 6px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn { padding: 14px 26px; border-radius: 999px; font-weight: 500; font-size: 1.05rem; background: var(--lilac); color: var(--on-pastel); min-height: 52px; }
.btn.ghost { background: var(--card); border: 2px solid var(--line); color: var(--ink); }
.btn.mint { background: var(--mint); color: var(--on-pastel); }

/* Reward */
.reward-card {
  background: var(--butter); color: var(--on-pastel); border-radius: 36px; padding: 34px 24px;
  margin: 22px 0 28px; width: 100%; position: relative; z-index: 2;
}
.reward-card .emoji { font-size: 3.4rem; line-height: 1; }
.reward-card p { font-size: 1.8rem; font-weight: 600; line-height: 1.2; margin-top: 14px; }
.pop { animation: pop .6s cubic-bezier(.2, 1.3, .4, 1) both; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
.confetti i { position: absolute; top: -20px; width: 12px; height: 16px; border-radius: 4px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

/* Settings */
.list { display: grid; gap: 10px; margin: 20px 0 24px; padding: 0; list-style: none; }
.list li { display: flex; gap: 10px; align-items: center; }
.list .dot { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: .9rem; color: var(--on-pastel); font-weight: 500; }
.list input {
  flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--card);
  border: 2px solid var(--line); border-radius: 18px; padding: 12px 16px;
}
.list input::placeholder { color: var(--ink-soft); opacity: .7; }
.saved { color: var(--ink-soft); min-height: 1.5em; margin-top: 12px; }

@media (prefers-reduced-motion: reduce) {
  .pop, .confetti i { animation: none; }
  .ring-fg { transition: none; }
}
</style>
</head>
<body>
<main class="app">

  <!-- Start -->
  <section id="screen-home">
    <div class="top">
      <div>
        <span class="brand">You can do this ✨</span>
        <h1>Hoe lang ga je leren?</h1>
        <p class="sub">Kies een tijd. Als je klaar bent, wacht er een verrassing.</p>
      </div>
      <button class="icon-btn" id="open-settings" aria-label="Mijn beloningen aanpassen">✏️</button>
    </div>
    <div class="times" id="times"></div>
    <p class="note" id="home-note"></p>
  </section>

  <!-- Timer -->
  <section id="screen-timer" class="center" hidden>
    <h2 id="timer-title">Je bent aan het leren</h2>
    <p class="sub" id="timer-sub" aria-live="polite" style="min-height:2.9em;max-width:22em"></p>
    <div class="ring-wrap">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-bg" cx="100" cy="100" r="88" fill="none" stroke-width="14"></circle>
        <circle class="ring-fg" id="ring" cx="100" cy="100" r="88" fill="none" stroke-width="14" stroke-linecap="round"></circle>
      </svg>
      <div class="ring-text" role="timer" aria-live="off">
        <b id="clock">10:00</b>
        <span id="clock-label">nog te gaan</span>
      </div>
    </div>
    <div class="row">
      <button class="btn ghost" id="pause">Pauze</button>
      <button class="btn ghost" id="stop">Stoppen</button>
    </div>
  </section>

  <!-- Beloning -->
  <section id="screen-reward" class="center" hidden>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <h1 id="reward-head">Gelukt!</h1>
    <p class="sub" id="reward-sub"></p>
    <div class="reward-card pop">
      <div class="emoji" aria-hidden="true">🎁</div>
      <p id="reward-text"></p>
    </div>
    <button class="btn mint" id="again">Terug naar start</button>
  </section>

  <!-- Beloningen invullen -->
  <section id="screen-settings" hidden>
    <h1>Mijn beloningen</h1>
    <p class="sub">Vul tot 10 beloningen in. De app kiest er na het leren één uit.</p>
    <ul class="list" id="reward-list"></ul>
    <div class="row" style="justify-content:flex-start">
      <button class="btn mint" id="save">Opslaan</button>
      <button class="btn ghost" id="cancel">Terug</button>
    </div>
    <p class="saved" id="saved" role="status"></p>
  </section>

</main>

<script>
(function () {
  var MINUTES = [10, 20, 30, 45, 60];
  var DEFAULTS = [
    "Een half uurtje Netflix kijken",
    "Iets lekkers pakken",
    "10 minuten dansen op je favoriete muziek",
    "Een kopje thee of chocomel maken",
    "Een berichtje sturen naar een vriendin",
    "Een stukje fruit met chocolade",
    "Een kwartier op je telefoon",
    "Een stukje wandelen in de zon",
    "Een nieuw hoofdstuk in je boek lezen",
    "Een vrij moment: jij kiest!"
  ];
  var DOT_COLORS = ["var(--mint)", "var(--sky)", "var(--rose)", "var(--butter)", "var(--peach)", "var(--lilac)"];
  var CONFETTI_COLORS = ["#d8c8f5", "#c6efdc", "#ffd8c4", "#fff0b3", "#c9e4fa", "#f8cfe0"];
  var RING = 2 * Math.PI * 88;

  var $ = function (id) { return document.getElementById(id); };
  var screens = ["home", "timer", "reward", "settings"];
  function show(name) {
    screens.forEach(function (s) { $("screen-" + s).hidden = (s !== name); });
    window.scrollTo(0, 0);
  }

  /* ---------- opslag ---------- */
  function load(key, fallback) {
    try {
      var v = localStorage.getItem(key);
      return v ? JSON.parse(v) : fallback;
    } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; }
  }
  var rewards = load("leer.rewards", null);
  if (!Array.isArray(rewards) || rewards.length !== 10) rewards = DEFAULTS.slice();
  var lastReward = load("leer.last", -1);

  /* ---------- startscherm ---------- */
  var timesEl = $("times");
  MINUTES.forEach(function (m) {
    var b = document.createElement("button");
    b.className = "time";
    b.innerHTML = "<b>" + m + "</b><span>minuten</span>";
    b.setAttribute("aria-label", m + " minuten leren");
    b.addEventListener("click", function () { start(m); });
    timesEl.appendChild(b);
  });
  function updateNote() {
    var n = rewards.filter(function (r) { return r.trim(); }).length;
    $("home-note").textContent = n === 0
      ? "Je hebt nog geen beloningen ingevuld. Tik op het potlood."
      : n + " beloningen staan klaar. Welke het wordt? Dat is een verrassing!";
  }
  updateNote();

  /* ---------- timer ---------- */
  var total = 0, endAt = 0, remaining = 0, paused = false, tick = null, chosen = 0;
  var PHRASES = [
    ["Het begin is het moeilijkst, en jij bent al bezig!", "Mooi gestart. Je bent onderweg!", "Eerst even inkomen, daarna gaat het lopen."],
    ["Goed bezig! Hou dit vast.", "Je ritme zit erin.", "Stap voor stap kom je er."],
    ["Je bent op de helft! 🎉", "De helft is al gedaan. Wat goed!"],
    ["Het meeste heb je al gedaan. Doorgaan!", "Elke minuut telt, en jij telt ze allemaal.", "Je kunt dit. Dat laat je nu zien."],
    ["Bijna daar! Je beloning wacht al. 🎁", "Nog even volhouden, je bent er bijna!", "De finish is in zicht! 💜"]
  ];
  var lastStage = -1;
  function stageFor(done) { return done < 0.2 ? 0 : done < 0.45 ? 1 : done < 0.6 ? 2 : done < 0.85 ? 3 : 4; }
  function fmt(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000));
    var m = Math.floor(s / 60), r = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r;
  }
  function start(min) {
    chosen = min;
    total = min * 60000;
    remaining = total;
    endAt = Date.now() + total;
    paused = false;
    $("ring").style.strokeDasharray = RING;
    $("ring").style.strokeDashoffset = 0;
    $("pause").textContent = "Pauze";
    lastStage = -1;
    $("clock-label").textContent = "nog te gaan";
    show("timer");
    render();
    clearInterval(tick);
    tick = setInterval(step, 250);
  }
  function render() {
    var left = paused ? remaining : endAt - Date.now();
    $("clock").textContent = fmt(left);
    var done = 1 - Math.max(0, left) / total;
    $("ring").style.strokeDashoffset = RING * done;
    if (!paused) {
      var st = stageFor(done);
      if (st !== lastStage) {
        lastStage = st;
        var opts = PHRASES[st];
        $("timer-sub").textContent = opts[Math.floor(Math.random() * opts.length)];
      }
    }
    document.title = (paused ? "⏸ " : "") + fmt(left) + " · You can do this";
  }
  function step() {
    if (paused) return;
    if (endAt - Date.now() <= 0) { finish(); return; }
    render();
  }
  $("pause").addEventListener("click", function () {
    if (!paused) {
      remaining = endAt - Date.now();
      paused = true;
      $("pause").textContent = "Verder";
      $("clock-label").textContent = "pauze";
      $("timer-sub").textContent = "Even adem halen. Je mag zo weer verder.";
    } else {
      endAt = Date.now() + remaining;
      paused = false;
      lastStage = -1;
      $("pause").textContent = "Pauze";
      $("clock-label").textContent = "nog te gaan";
    }
    render();
  });
  $("stop").addEventListener("click", function () {
    if (confirm("Weet je het zeker? Als je nu stopt, krijg je geen beloning.")) {
      clearInterval(tick);
      document.title = "You can do this";
      show("home");
    }
  });

  /* ---------- beloning ---------- */
  function beep() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      [523.25, 659.25, 783.99].forEach(function (f, i) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = f;
        o.connect(g); g.connect(ctx.destination);
        var t = ctx.currentTime + i * 0.18;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
        o.start(t); o.stop(t + 0.55);
      });
    } catch (e) {}
  }
  function pickReward() {
    var pool = [];
    rewards.forEach(function (r, i) { if (r.trim()) pool.push(i); });
    if (!pool.length) return -1;
    if (pool.length > 1) pool = pool.filter(function (i) { return i !== lastReward; });
    return pool[Math.floor(Math.random() * pool.length)];
  }
  function confetti() {
    var box = $("confetti");
    box.innerHTML = "";
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    for (var i = 0; i < 46; i++) {
      var p = document.createElement("i");
      p.style.left = Math.random() * 100 + "%";
      p.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      p.style.animationDuration = 2.6 + Math.random() * 2.4 + "s";
      p.style.animationDelay = Math.random() * 1.2 + "s";
      p.style.transform = "rotate(" + Math.random() * 360 + "deg)";
      box.appendChild(p);
    }
  }
  function finish() {
    clearInterval(tick);
    document.title = "You can do this";
    var idx = pickReward();
    if (idx >= 0) { lastReward = idx; save("leer.last", idx); }
    $("reward-sub").textContent = "Je hebt " + chosen + " minuten geleerd. Dit is je beloning:";
    $("reward-text").textContent = idx >= 0 ? rewards[idx] : "Je mag zelf iets leuks verzinnen!";
    show("reward");
    confetti();
    beep();
  }
  $("again").addEventListener("click", function () { $("confetti").innerHTML = ""; show("home"); });

  /* ---------- instellingen ---------- */
  var listEl = $("reward-list");
  function buildList() {
    listEl.innerHTML = "";
    rewards.forEach(function (r, i) {
      var li = document.createElement("li");
      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = DOT_COLORS[i % DOT_COLORS.length];
      dot.textContent = i + 1;
      var inp = document.createElement("input");
      inp.type = "text";
      inp.maxLength = 80;
      inp.value = r;
      inp.placeholder = "Beloning " + (i + 1);
      inp.setAttribute("aria-label", "Beloning " + (i + 1));
      li.appendChild(dot); li.appendChild(inp);
      listEl.appendChild(li);
    });
  }
  $("open-settings").addEventListener("click", function () {
    buildList(); $("saved").textContent = ""; show("settings");
  });
  $("cancel").addEventListener("click", function () { show("home"); });
  $("save").addEventListener("click", function () {
    var vals = Array.prototype.map.call(listEl.querySelectorAll("input"), function (i) { return i.value.trim(); });
    rewards = vals;
    var ok = save("leer.rewards", rewards);
    updateNote();
    $("saved").textContent = ok ? "Opgeslagen! 🎉" : "Opgeslagen voor nu, maar niet bewaard als je de app sluit.";
  });

  /* de timer blijft kloppen als de telefoon even in slaapstand ging */
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && !$("screen-timer").hidden && !paused) step();
  });
})();
</script>
</body>
</html>
